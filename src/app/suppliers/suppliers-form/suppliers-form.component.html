<form (submit)="saveChanges()" [formGroup]="form">
    <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput [formControl]="form.controls.name" />
        <mat-error>{{getErrorMessagesForName()}}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Date of Creation</mat-label>
        <mat-datepicker #picker></mat-datepicker>
        <input matInput [matDatepicker]="picker" [formControl]="form.controls.creationDate" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-error>{{getErrorMessagesForDateOfCreation()}}</mat-error>
    </mat-form-field>

    <h4>Select the location of the Supplier:</h4>

    <app-map [initialCoordinates]="initialCoordinate" 
        (coordinateSelected)="handleCoordinateSelection($event)">
    </app-map>

    <div class="buttons-container">
        <button mat-flat-button type="submit" [disabled]="form.invalid">Save changes</button>
        <a mat-stroked-button routerLink="/suppliers">Cancel</a>
    </div>

</form>
