<form>
    <mat-form-field>
        <input type="text" placeholder="Write the Suppliers Name" matInput [formControl]="control"
        [matAutocomplete]="auto" />
        <mat-autocomplete #auto (optionSelected)="handleSelection($event)">
            @for (supplier of suppliers; track $index){
                <mat-option [value]="supplier">
                    {{supplier.name}}
                </mat-option>
            }
        </mat-autocomplete>
    </mat-form-field>
</form>

@if(suppliersSelected.length > 0){
    <table mat-table [dataSource]="suppliersSelected" class="mat-elevation-z8"
    cdkDropList [cdkDropListData]="suppliersSelected" (cdkDropListDropped)="handleDrop($event)"
    >

        <ng-container matColumnDef="name">
            <td mat-cell *matCellDef="let element">
                {{element.name}}
            </td>
        </ng-container>

        <ng-container matColumnDef="supplierAddress">
            <td mat-cell *matCellDef="let element">
                <mat-form-field appearance="outline" style="margin: 10px 0;">
                    <mat-label>Supplier Address</mat-label>
                    <input matInput [(ngModel)]="element.supplierAddress" />
                </mat-form-field>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <td mat-cell *matCellDef="let element">
                <mat-icon mat-list-icon (click)="delete(element)">
                    Close
                </mat-icon>

            </td>

        </ng-container>

        <tr mat-row *matRowDef="let row; columns: columnsToDisplay" cdkDrag [cdkDragData]="row"></tr>

    </table>
}
